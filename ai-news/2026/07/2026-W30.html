om.tw/news/177578"}, {"name": "OpenAI Blog", "url": "https://openai.com/blog/"}]}, {"id": 5, "title": "ChatGPT Health在美公開推出，串接Apple Health與電子病歷", "tags": ["ai"], "summary": "OpenAI在美國公開推出ChatGPT Health功能，18歲以上用戶可串接Apple Health及醫療機構電子病歷，讓ChatGPT在一般對話中調用個人健康資料回答問題。全球每週已有超過3億人透過ChatGPT詢問健康問題，OpenAI強調串接資料絕不用於模型訓練或廣告。", "sales_tip": "醫療保健客戶可關注ChatGPT Health的資料整合與隱私設計，作為建構AI健康應用時的參考，特別是在患者資料授權機制與去識別化處理的實務做法。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177595"}, {"name": "OpenAI Blog", "url": "https://openai.com/blog/"}]}, {"id": 6, "title": "Bun創辦人用AI重寫53萬行程式，11天完成一年工程", "tags": ["ai", "it"], "summary": "Bun創辦人Jarred Sumner利用64支Claude分工進行改寫、除錯與審查，僅11天就將53萬行Zig程式轉換為Rust，原本需3位資深工程師一年的工程。新版Bun通過全平台測試，效能提升2-5%且修復128項舊問題，驗證AI輔助開發在大型重構上的商業可行性。", "sales_tip": "向客戶展示AI Coding已能勝任大型系統重構，建議評估內部遺留系統現代化的可行性，11天完成一年工程代表巨大的開發成本節省潛力與競爭優勢。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177619"}, {"name": "Bun Blog", "url": "https://bun.sh/blog"}]}, {"id": 7, "title": "GitHub搶先支援無狀態MCP，AI代理存取服務免綁定工作階段", "tags": ["ai", "it"], "summary": "GitHub MCP伺服器提前支援新版無狀態MCP架構，移除初始化與協定層工作階段需求。每筆請求自行攜帶處理資訊，負載平衡器可將不同請求分派至不同伺服器，大幅簡化AI代理存取外部工具時的多伺服器部署難題，無需再建置共用儲存或工作階段綁定機制。", "sales_tip": "客戶若正在建構AI代理平台，可推薦基於MCP無狀態架構的整合方案，簡化水準擴展與多伺服器維運複雜度，降低基礎設施成本。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177612"}, {"name": "GitHub Blog", "url": "https://github.blog/"}]}, {"id": 8, "title": "美國警告制裁中國AI模型蒸餾行為，開源模型面臨調查", "tags": ["ai", "security"], "summary": "美國財政部長Scott Bessent表示將調查中國開源AI模型是否透過未經授權的模型蒸餾取得美國業者智慧財產，若查證屬實不排除制裁相關企業。Bessent聲稱已在多個中國AI模型中發現美國LLM浮水印，並考慮要求採用中國AI模型的美國企業向使用者揭露。", "sales_tip": "提醒客戶關注AI模型合規風險，使用中國開源模型可能面臨未來美國監管與制裁要求，建議在採購AI方案時將地緣政治合規與供應鏈風險納入評估架構。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177521"}, {"name": "iThome", "url": "https://www.ithome.com.tw/news/177545"}]}, {"id": 9, "title": "Chrome 150緊急更新修補4個高風險漏洞，呼籲立即升級", "tags": ["security", "it"], "summary": "Google於7月23日發布Chrome 150.0.7871.186/187緊急安全更新，修補CVE-2026-16804至CVE-2026-16807共4個高風險漏洞。此為Chrome 150版本的重大安全更新，Google呼籲所有用戶立即升級。瀏覽器已成為企業端點安全中最頻繁的攻擊入口之一。", "sales_tip": "主動聯繫客戶確認瀏覽器更新政策與端點管理方案，Chrome漏洞修補頻率持續升高，推薦導入企業級瀏覽器管理與自動化更新機制，降低端點攻擊面。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177624"}, {"name": "Chrome Releases", "url": "https://chromereleases.googleblog.com/"}]}, {"id": 10, "title": "7,600個惡意GitHub儲存庫偽裝AI工具，散布SmartLoader", "tags": ["security"], "summary": "大規模攻擊活動FakeGit利用約6,600個GitHub帳號建立7,600個惡意儲存庫，將SmartLoader惡意軟體偽裝成AI Skill與MCP伺服器。攻擊者複製熱門專案外觀並累積星號與分支紀錄，誘騙開發者下載執行。此攻擊凸顯開源軟體供應鏈安全面臨AI主題偽裝的新型態威脅。", "sales_tip": "與開發團隊討論開源套件安全審查流程，推薦導入軟體供應鏈安全方案如SBoM與套件掃描工具，以AI Skill名義的惡意套件為今年最值得關注的新型態攻擊。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177616"}, {"name": "BleepingComputer", "url": "https://www.bleepingcomputer.com/"}]}]};
