NS 2026年調查顯示，將AI納入資安策略的組織比例從去年50%躍升至78%，但僅36%建立正式AI風險管理與法規遵循計畫。63%受訪者表示組織無法掌握AI模型使用位置及可能暴露資料，AI治理進度明顯落後於應用速度，形成新的資安缺口。", "sales_tip": "可引導客戶討論AI治理現狀，推薦AI安全評估與模型監管方案，強調擴大AI應用必須同步補足風險管理缺口。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177383"}, {"name": "SANS Institute", "url": "https://www.sans.org/2026-ai-security-survey/"}]}, {"id": 10, "title": "傳蘋果計畫收購AI晶片新創，自家Baltra晶片進度落後", "tags": ["ai", "it"], "summary": "據The Information報導，蘋果正評估收購AI晶片新創公司以加速AI布局。蘋果自研AI伺服器晶片Baltra原訂今年出貨但進度落後，可能延後至2029年，迫使新版Siri暫時轉用Google Cloud與Nvidia GPU。顯示AI硬體自研難度高，即使是蘋果也面臨挑戰。", "sales_tip": "蘋果AI布局延遲對採用Apple生態系的企業客戶是重要訊號，可提醒關注跨平台AI整合策略，避免過度依賴單一廠商。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177363"}, {"name": "The Information", "url": "https://www.theinformation.com/articles/apple-ai-chip-acquisition-talks"}]}]};
