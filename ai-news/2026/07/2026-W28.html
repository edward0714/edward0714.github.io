<style>
:root,[data-theme="dark"]{--bg:#0b1120;--bg2:#111827;--bg-card:rgba(255,255,255,0.03);--bg-hover:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.06);--border-hover:rgba(255,255,255,0.12);--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--blue:#3b82f6;--orange:#f59e0b;--red:#ef4444;--green:#22c55e;--rad-sm:8px;--rad-lg:16px}

.nav-brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-weight:700;font-size:.95rem}
.nav-link{padding:6px 12px;border-radius:var(--rad-sm);text-decoration:none;color:var(--text2);font-size:.85rem}

.page-hdr{display:flex;align-items:center;gap:14px;margin:24px 0 16px;flex-wrap:wrap}

.report-meta{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:24px;padding:16px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rad-lg)}
.report-meta .label{font-size:.75rem;color:var(--text3)}
.report-meta .val{font-size:.9rem;font-weight:600}
.report-meta .badge{font-size:.72rem;padding:3px 10px;border-radius:6px;background:rgba(245,158,11,.15);color:var(--orange);font-weight:500}
.topic-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rad-lg);padding:20px 24px;margin-bottom:14px;transition:all .2s}
.topic-card:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 4px 16px rgba(245,158,11,.1)}
.topic-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#f97316,#f59e0b);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;flex-shrink:0}
.topic-hdr{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.topic-title{font-size:1.05rem;font-weight:600;line-height:1.4}
.topic-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;margin-left:40px}
.topic-tag{font-size:.7rem;padding:2px 8px;border-radius:4px}
.topic-tag.ai{background:rgba(245,158,11,.1);color:var(--orange)}
.topic-tag.it{background:rgba(34,197,94,.1);color:var(--green)}
.topic-tag.security{background:rgba(239,68,68,.1);color:var(--red)}
.topic-summary{font-size:.85rem;color:var(--text2);line-height:1.6;margin-bottom:10px}
.topic-sales{font-size:.82rem;color:var(--orange);line-height:1.5;padding:10px 14px;background:rgba(245,158,11,.04);border-left:3px solid var(--orange);border-radius:4px;margin-bottom:10px}
.topic-ref{font-size:.75rem;color:var(--text3)}
.topic-ref a{color:var(--blue);text-decoration:none}
.topic-ref a:hover{text-decoration:underline}
.page-footer{text-align:center;padding:40px 20px;color:var(--text3);font-size:.8rem;border-top:1px solid var(--border);margin-top:40px}
.page-footer a{color:var(--blue);text-decoration:none}
@media(max-width:640px){.topic-hdr{flex-direction:column}.topic-tags{margin-left:0}}
</style>

, {"name": "數位發展部", "url": "https://www.moda.gov.tw/press/2026-07-06-001.html"}]}, {"id": 6, "title": "LockBit 4.0鎖定台廠供應鏈勒索攻擊", "tags": ["security"], "summary": "LockBit勒索軟體4.0利用零時差漏洞入侵台灣多家電子製造業ERP系統，攻擊採供應鏈橫向擴散模式。趨勢科技與中華資安發布緊急應變通報。", "sales_tip": "向客戶說明供應鏈資安連鎖效應，推薦供應商安全評估與端點偵測回應方案。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/162388"}, {"name": "資安人", "url": "https://www.isecurity.com.tw/article/detail/20260708-lockbit-4-0-attack/"}]}, {"id": 7, "title": "Google Gemini Ultra 2：邊緣AI晶片效能激增5倍", "tags": ["ai", "it"], "summary": "Google發布Gemini Ultra 2晶片與TPU v7，專為邊緣端AI推論設計，效能提升5倍，功耗僅35W。台灣工業電腦業者研華、友通已規劃導入智慧工廠方案。", "sales_tip": "製造業客戶若無法上雲，可介紹Edge AI方案，強調離線運作與低延遲優勢。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/162395"}, {"name": "Google AI Blog", "url": "https://ai.googleblog.com/2026/07/gemini-ultra-2-edge-ai.html"}]}, {"id": 8, "title": "AI驅動新型DDoS攻擊鎖定台灣金融電商", "tags": ["security"], "summary": "Cloudflare報告揭露AI驅動的新型DDoS攻擊，攻擊者利用生成式AI動態產生HTTP請求繞過WAF。Q2攻擊量成長300%，台灣金融、電商為主要目標。", "sales_tip": "可詢問客戶網站是否有異常流量，介紹AI驅動的DDoS防護方案。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/162340"}, {"name": "Cloudflare Blog", "url": "https://blog.cloudflare.com/2026-h1-ddos-threat-report/"}]}, {"id": 9, "title": "鴻海攜手NVIDIA打造台灣AI超級電腦", "tags": ["ai", "it"], "summary": "鴻海與NVIDIA合作，在高雄建置台灣最大AI超級電腦「福爾摩沙二號」，採用20,000顆B300 GPU，運算能力達500 ExaFLOPs，預計2027年初啟用。", "sales_tip": "對無法自建AI基礎設施的中型客戶，可推薦算力租賃方案。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/162375"}, {"name": "經濟日報", "url": "https://money.udn.com/money/story/5612/8123456"}]}, {"id": 10, "title": "歐盟AI Act正式生效衝擊台廠供應鏈", "tags": ["ai", "security"], "summary": "歐盟AI Act於2026年7月全面生效，台灣多家出口歐盟的電子與工具機製造商需符合透明度與風險管理要求。BSI台灣推出AI合規輔導方案。", "sales_tip": "主動提醒有歐盟客戶的廠商注意供應鏈AI合規條款。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/162385"}, {"name": "BSI台灣", "url": "https://www.bsigroup.com/zh-TW/ai-act-2026/"}]}]};

    document.getElementById('topicsContainer').innerHTML = D.topics.map((t,i) => '<div class="topic-card"><div class="topic-hdr"><div class="topic-num">'+(i+1)+'</div><div style="flex:1;min-width:0"><div class="topic-title">'+t.title+'</div></div></div><div class="topic-tags">'+(t.tags||[]).map(tg=>'<span class="topic-tag '+tg+'">'+tg.toUpperCase()+'</span>').join('')+'</div><div class="topic-summary">'+t.summary+'</div>'+(t.sales_tip?'<div class="topic-sales">💡 '+t.sales_tip+'</div>':'')+'<div class="topic-ref">📎 參考來源：'+(t.refs||[]).map(r=>'<a href="'+r.url+'" target="_blank" rel="noopener">'+r.name+'</a>').join(' · ')+'</div></div>').join('');
