const D = {"week": "2026-W32 (8/3-8/9)", "generated_at": "2026-08-08T10:00:00+08:00", "source_note": "資料來源：iThome Taiwan、資安新聞網站、AI 熱門媒體", "topics": [{"id": 1, "title": "ChatGPT 免費版升級 GPT-5.6 Luna，文字聊天不限次數", "tags": ["ai"], "summary": "OpenAI 宣布將 ChatGPT 免費版及 Go 方案的預設模型由 GPT-5.5 Instant 升級為 GPT-5.6 Luna，並取消一般文字聊天訊息次數限制。同時新增 Think 按鈕，讓使用者在複雜問題上投入更多推理時間。OpenAI 表示目前全球每周已有 10 億人使用 ChatGPT，GPT-5.6 Luna 回答出現事實錯誤的比例較前一代減少約 62%。", "sales_tip": "向客戶強調 ChatGPT 免費版吃到飽代表 AI 普及化加速，企業應思考如何將 AI 聊天整合至客服、內部知識庫等場景，降低一線人力負擔。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177943"}, {"name": "OpenAI Blog", "url": "https://openai.com/index/improving-gpt-5-6-sol-in-chatgpt/"}]}, {"id": 2, "title": "Meta 推出 Muse Code 程式代理人，低價挑戰 Claude Code", "tags": ["ai"], "summary": "Meta 推出 AI 程式代理人 Muse Code，搭配新版 Muse Spark 1.2 模型，可協助開發者理解大型程式碼庫、規劃修改及撰寫程式碼。Muse Code 每百萬 token 收費僅 1.25/4.25 美元，遠低於 Claude Sonnet 5 的 3/15 美元。華爾街日報分析，Meta 以價格而非性能爭取開發者，反映 AI 投資轉化為營收的壓力。", "sales_tip": "與客戶討論 AI 程式開發工具時，可比較不同方案的性價比。Muse Code 的低價策略可能驅動企業採用，特別適合大量程式開發但預算有限的團隊。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177934"}, {"name": "WSJ", "url": "https://www.wsj.com/tech/ai/meta-releases-coding-agent-to-compete-with-openai-and-anthropic-af87b517"}]}, {"id": 3, "title": "Amazon 開源多代理工具 Kiro Crew，內部逾 3.9 萬人採用", "tags": ["ai", "it"], "summary": "AWS 將內部專案 MeshClaw 改名為 Kiro Crew 並開源，可分派多個 AI 代理平行處理問題單、異常調查與系統搬遷，保存專案脈絡與修正紀錄。該工具在 Amazon 內部已有逾 3.9 萬人採用、近 500 名貢獻者完成 597 項更新。支援桌面程式、網頁介面及 Slack/Telegram 整合，內建沙箱隔離與敏感路徑限制。", "sales_tip": "Kiro Crew 是企業級 AI 代理實戰案例，向客戶展示多代理協作在大型組織中的落地成效，協助評估 AI 代理在 IT 維運、DevOps 等場景的導入價值。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177933"}, {"name": "Kiro Blog", "url": "https://kiro.dev/blog/introducing-kiro-crew/"}]}, {"id": 4, "title": "SpaceX 斥資 168 億美元德州興建 AI 晶片廠 Terafab", "tags": ["ai", "it"], "summary": "德州州長 Abbott 宣布 SpaceX 將在德州格萊姆斯郡興建垂直整合 AI 晶片廠 Terafab，首期投資 168 億美元，預計創造 3,000 個工作機會。Terafab 整合晶片設計、光罩、製造、測試與先進封裝，產品供應 Tesla 自駕系統與 Optimus 人形機器人，以及 SpaceX 太空 AI 資料中心。馬斯克表示旗下 AI 應用未來所需運算力將超過 1 太瓦。", "sales_tip": "SpaceX/Tesla 自建晶片廠代表 AI 晶片需求持續爆炸性成長，客戶若評估資料中心或邊緣 AI 基礎設施投資，可引用此案例說明長期需求趨勢。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177953"}, {"name": "Reuters", "url": "https://www.reuters.com/business/media-telecom/spacex-says-terafab-be-built-texas-with-initial-investment-168-billion-2026-08-06/"}]}, {"id": 5, "title": "Google 首席科學家 Jeff Dean 離職，創立 AI 新創 Discovery Loop", "tags": ["ai"], "summary": "Google 首席科學家 Jeff Dean 宣布離職，攜手多位 Google 技術元老共同創立 AI 新創公司 Discovery Loop。Dean 在 Google 服務超過 25 年，主導 TensorFlow、Google Brain 等重要 AI 計畫。同期間，Google DeepMind 執行長 Demis Hassabis 也轉任 Alphabet 首席科學家，Google AI 高層經歷重大改組。", "sales_tip": "Google AI 高層接連異動反映 AI 人才持續流向新創，客戶若有人才招募或組織調整需求，可提醒 AI 領域的關鍵人才競爭激烈，需提前布局。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177911"}, {"name": "iThome", "url": "https://www.ithome.com.tw/news/177919"}]}, {"id": 6, "title": "黑帽大會：Nvidia 領軍開放安全 AI 聯盟提出 SAFE 指引", "tags": ["ai", "security"], "summary": "美國黑帽大會 Black Hat USA 2026 本週舉行，由 Nvidia 領軍、超過 120 家企業組織加入的開放安全 AI 聯盟（Open Safe AI Alliance），在大會首日提出共享 AI 發現交換（SAFE）指引草案。趨勢科技亦攜手 Anthropic、Nvidia 與 AWS，共同闡述 AI 代理時代的自動化威脅與聯防策略。", "sales_tip": "AI 資安聯防已成為產業共識，與客戶討論 AI 導入時應一併強調 AI 安全框架與跨組織資訊共享的重要性，可推薦 SAFE 指引作為評估基準。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177952"}, {"name": "iThome", "url": "https://www.ithome.com.tw/news/177926"}]}, {"id": 7, "title": "Nvidia Dynamo 修補 CVSS 9.8 重大程式碼執行漏洞", "tags": ["ai", "security"], "summary": "Nvidia 發布 Dynamo for Linux v1.3.0 更新，修補分散式 AI 推論服務框架的多項漏洞。其中最嚴重的是 CVE-2026-24254（CVSS 9.8），攻擊者可透過越界寫入執行程式碼、提升權限或竄改資料。另有 2 個 CVSS 8.2 漏洞及多個資料洩露漏洞，AI 基礎設施的安全性再受關注。", "sales_tip": "AI 推論基礎設施的安全性不容忽視，客戶若部署 Nvidia Dynamo 應立即升級至 1.3.0，並將其納入定期漏洞管理流程。可搭配討論 AI 供應鏈安全整體策略。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177960"}, {"name": "Nvidia Security", "url": "https://nvidia.custhelp.com/app/answers/detail/a_id/5842"}]}, {"id": 8, "title": "Gitea 修補 CVSS 9.8 漏洞，無須登入即可遠端執行程式碼", "tags": ["security"], "summary": "開源 Git 服務平臺 Gitea 揭露 CVE-2026-59774 重大漏洞（CVSS 9.8），影響 1.22.1 至 1.27.0 版本。攻擊者無須登入，只需利用 Org-mode 文件預覽功能讀取伺服器檔案，取得內部權杖後即可在伺服器上執行程式碼。官方已在 1.27.1 版本修補，但安全公告延遲至 8 月 2 日才對外揭露。", "sales_tip": "Gitea 廣泛用於企業內部 Git 託管，建議客戶立即檢查執行版本並升級至 1.27.1 以上。可藉此案例提醒客戶開源軟體的安全更新不可延遲，應建立自動化更新機制。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177977"}, {"name": "GitHub Advisory", "url": "https://github.com/go-gitea/gitea/security/advisories/GHSA-6v53-hr58-556r"}]}, {"id": 9, "title": "macOS ClickFix 攻擊進化，瀏覽器指紋躲避資安掃描", "tags": ["security"], "summary": "微軟揭露一波鎖定 macOS 的 ClickFix 攻擊活動，攻擊者使用伺服器端瀏覽器指紋閘道技術，先判斷訪客是否為真實 Mac 使用者，才顯示惡意下載頁面。不符合條件者只看到空白或正常網頁。微軟追蹤到超過 250 個相關網域，最終植入 Atomic Stealer（AMOS）竊資軟體，攻擊手法日趨精密。", "sales_tip": "向客戶說明社交工程攻擊持續進化，傳統 URL 過濾已不足以防護。建議導入端點偵測與回應（EDR）方案，並加強員工對「複製指令到終端機」等可疑操作的安全意識。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177959"}, {"name": "Microsoft Security", "url": "https://www.microsoft.com/en-us/security/blog/2026/08/05/macos-clickfix-campaign-learned-hide/"}]}, {"id": 10, "title": "Claude 分享對話遭 Google 索引，用戶敏感資訊恐外洩", "tags": ["ai", "security"], "summary": "資安業者 Malwarebytes 發現 Anthropic 的 Claude 分享對話功能產生的公開連結，可被 Google 搜尋引擎索引。部分用戶在對話中透露的敏感資訊因此意外曝光。此問題並非 Claude 獨有，Grok 與 Meta AI 過去也曾發生類似情況。Malwarebytes 建議避免分享 AI 對話或輸入個人識別資訊。", "sales_tip": "與客戶討論 AI 工具使用政策時，提醒建立明確的資料分級與分享規範。可推薦資料外洩防護（DLP）方案，並教育員工勿在 AI 聊天工具中輸入機密資訊。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/177976"}, {"name": "Malwarebytes", "url": "https://www.malwarebytes.com/blog/privacy/2026/07/shared-claude-chats-were-searchable-on-google"}]}]};

(function(){

})();
