<script>
const D = {"week":"2026-W38 (9/14-9/20)","generated_at":"2026-09-19T10:00:00+08:00","source_note":"資料來源：iThome Taiwan、資安新聞網站、AI 熱門媒體","topics":[{"id":1,"title":"OpenAI 推出法律專業版 GPT-6 Astra for Law，可搜尋逾 2.3 億網址法律資料","tags":["ai"],"summary":"OpenAI 週四（9/17）進軍法律垂直市場，推出 Astra for Law，將旗艦模型 GPT-6 Astra 結合涵蓋超過 2.3 億個網址的法律搜尋索引，並與非營利組織 Free Law Project 合作納入超過 99.9% 已公布的美國判例。在 Vals AI Legal Research Bench 測試中，Astra for Law 有 54% 問題通過整體正確性，相較僅用網搜的 GPT-6 Astra（38.7%）提升約 40%。初期透過 Trusted Access 計畫提供特定律所，並同步開放 ChatGPT for Word 及 26 個法律外掛工具。","sales_tip":"可向法律科技或專業知識型客戶說明「垂直化 AI」正成形，協助評估導入領域資料庫＋模型的檢索增強方案，而非只用通用模型。","refs":[{"name":"iThome","url":"https://www.ithome.com.tw/news/179053"},{"name":"OpenAI 官方","url":"https://openai.com/"}]},{"id":2,"title":"GPT-6 Astra 需求爆量，OpenAI 暫停 200 美元 Pro 方案新訂閱","tags":["ai"],"summary":"OpenAI 產品負責人 Thibault Sottiaux 於（9/10）透過 X 宣布，因 GPT-6 Astra 推出後需求爆量，將暫停每月 200 美元 Pro 方案的新訂閱與升級，以降低系統負載、優先維持既有用戶服務品質。GPT-6 Astra 於 9/3 發表，是首個被評定達到《準備框架》重大（Critical）網路安全能力門檻的模型，外界高度肯定其在電腦操作與長任務穩定度上的進步。既有 200 美元 Pro 用戶不受影響，尚未公布何時恢復新訂閱。","sales_tip":"反映旗艦 AI 算力與授權供給緊張，可提醒客戶及早盤點 AI 用量與預算、鎖定合約，並規畫 private 自建或混合部署以分散對單一供應商的依賴。","refs":[{"name":"iThome","url":"https://www.ithome.com.tw/news/178866"},{"name":"OpenAI 官方","url":"https://openai.com/"}]},{"id":3,"title":"Anthropic：Claude 已主導 26% 的 AI 研發工作，導入 AL0-AL5 自動化分級","tags":["ai"],"summary":"Anthropic 週四（9/17）公布最新 AI 發展速度衡量研究，揭露截至今年 8 月，Claude 已能主導公司約 26% 的 AI 研發工作（達 Epoch AI 的 AL4「主導」級別），達「協作」以上程度（AL3 以上）的占比更超過 90%。Anthropic 提出「研發自動化指數」與三面向衡量方法，並揭露內部高峰期約 3 萬個 AI 代理同時運作、8 月超過 10 億次代理決策，其中約 0.002% 遭即時監控系統阻擋，顯示 AI 自我改善與治理議題已成為焦點。","sales_tip":"用「AI 參與自身研發」話題切入 AI 治理與可觀察性需求，向企業客戶說明導入 AI 代理時須同步建立監督、把關與身分治理機制。","refs":[{"name":"iThome","url":"https://www.ithome.com.tw/news/179048"},{"name":"Anthropic 研究部落格","url":"https://www.anthropic.com/engineering"}]},{"id":4,"title":"數發部公布首波主權 AI 評測，本地模型在臺灣價值觀理解超越國際大模型","tags":["it"],"summary":"數發部 AI 產品與系統評測中心（AIEC）公布首波臺灣主權 AI 評測結果，針對 188 個國內外通用 AI 模型，以臺灣繁體中文理解、社會文化理解、價值觀理解 3 項指標測試。結果顯示國際大型模型在繁體中文能力已有水準，但臺灣本土模型在價值觀理解項目表現較佳，準確率達 92% 至 100%。數發部並與八大部會啟動 AI 風險盤點，擬 2027 年 6 月底前完成部會首輪法規調適；未來治理重點將延伸至 AI Agent 的授權、安全、身分認證與可問責性。","sales_tip":"主權 AI 與 Agent 治理是公部門與金融客戶採購關鍵，可協助客戶檢視模型是否符合繁體中文與在地文化需求，並導入合規與可問責的 AI 治理架構。","refs":[{"name":"iThome","url":"https://www.ithome.com.tw/news/178920"},{"name":"iThome 新聞","url":"https://www.ithome.com.tw/news"}]},{"id":5,"title":"英特爾布局邊緣 AI 生態系，從零售、製造到交通推動 Physical AI 落地","tags":["it"],"summary":"英特爾認為下一階段競爭關鍵將從模型訓練轉向 AI 部署與應用，未來邊緣 AI 將結合 Agentic AI 與 Physical AI，透過感知、推理與行動能力，推動零售、交通、製造與機器人垂直應用。英特爾推出 Open Edge Platform，採 CPU/GPU/NPU 的 XPU 協同架構，並布局 Robotics AI Suite、Physical AI Studio 與 OpenVINO Physical AI Framework，強調以開放生態系讓 ODM 與軟體夥伴共同開發，而非只提供單一硬體產品。","sales_tip":"針對製造與零售客戶，可用「邊緣 AI＋機器人/品質檢測」場景切入，說明如何將既有攝影機、感測器升級為具備感知-推理-行動的 AI 解決方案。","refs":[{"name":"iThome","url":"https://www.ithome.com.tw/news/179031"},{"name":"iThome 新聞","url":"https://www.ithome.com.tw/news"}]},{"id":6,"title":"Lucid 攜手 Bolt 在歐洲部署 2.5 萬輛 Level 4 自駕計程車，採用 NVIDIA Hyperion 平台","tags":["it"],"summary":"美國電動車業者 Lucid 與歐洲叫車平台 Bolt 宣布策略合作，共同開發 SAE Level 4 自駕車與叫車服務。Bolt 計畫在歐洲部署至少 2.5 萬輛 Lucid 自駕計程車，並採用 NVIDIA Hyperion 自動駕駛平台。Lucid 透過旗下 Lucid Technologies 提供車輛平台與自駕技術，Bolt 運用其歐洲營運經驗與資料負責車隊基礎設施與城市合作。目前雙方未透露交易金額，Lucid 執行長表示首批自駕車最快 2028 年推出，此規模約為 Bolt 2035 年 10 萬輛目標的四分之一。","sales_tip":"自駕與 AI 車聯網帶動高階運算、感測與資料平台需求，可向車用電子與資通訊客戶布局 Level 4 相關的運算、驗證與數據治理商機。","refs":[{"name":"iThome","url":"https://www.ithome.com.tw/news/179058"},{"name":"iThome 新聞","url":"https://www.ithome.com.tw/news"}]},{"id":7,"title":"Docker 沙箱環境存在重大漏洞 CVE-2026-77179，攻擊者可讀取及竄改 macOS 主機檔案","tags":["security"],"summary":"Docker 於 9/7 推出的 Docker Sandboxes 0.42.0 版安全性更新中，修補兩個資安漏洞，其中重大等級漏洞 CVE-2026-77179 影響 macOS 用戶，CVSS v4.0 評分高達 9.4。該漏洞存在於 macOS 版 Docker Sandboxes 的 virtio-fs 主機伺服器元件，攻擊者可將上層資料夾路徑置換為符號連結，從沙箱逃逸並以虛擬機器管理員身分讀取或竄改主機任何檔案，甚至能在 Mac 主機執行程式碼。Docker 呼籲用戶盡快更新。","sales_tip":"容器與開發環境安全是現代軟體交付關鍵，可提醒客戶檢視容器 sandbox、映像與 CI/CD 鏈路，導入容器安全掃描與漏洞管理。","refs":[{"name":"iThome","url":"https://www.ithome.com.tw/news/179050"},{"name":"iThome","url":"https://www.ithome.com.tw/news/179059"}]},{"id":8,"title":"BIND 9 修補 14 個弱點，其中包含可透過 DNS-over-HTTPS 造成服務中斷的漏洞","tags":["security"],"summary":"9/16 網際網路系統協會（ISC）發布 DNS 軟體 BIND 9 更新，修補 14 個資安漏洞，其中 7 個為高風險、7 個為中等風險。高風險漏洞 CVSS 皆為 7.5，攻擊者皆可遠端利用，多數可能造成阻斷服務（DoS）。其中較特別的是 CVE-2026-77692，攻擊者只要發送特製的 DNS-over-HTTPS（DoH）請求，挾帶無效的 SIG(0) 加密紀錄，就有機會造成 named 處理程序中斷。IT 人員應套用 9.20.29 或 9.21.26 版因應。","sales_tip":"DNS 是網路命脈，可協助客戶盤點 DNS 服務版本與更新機制，強化針對 DoH、DNS 側信道與阻斷服務攻擊的防護。","refs":[{"name":"iThome","url":"https://www.ithome.com.tw/news/179043"},{"name":"iThome 資安日報","url":"https://www.ithome.com.tw/news/179059"}]},{"id":9,"title":"Parallels Desktop 存在漏洞 ParaShells，低權限帳號即可 root 執行程式碼","tags":["security"],"summary":"資安公司 JFrog 公布 Mac 虛擬化軟體 Parallels Desktop 的本機權限提升漏洞 ParaShells（CVE-2026-90894），CVSS 評分 7.8。攻擊者只需取得沒有特殊權限的本機使用者帳號，搭配處理程序 prl_disp_service 的 Socket 連線，就有機會以 root 權限執行程式碼。Parallels 已於 8 月底發布 27.0.0 版完成修補，但因 27.0.0 僅支援 Apple Silicon，採 Intel 處理器執行 26 版及更早版本的 Mac 恐持續暴露風險。","sales_tip":"虛擬化軟體與本機提權漏洞提醒企業加裝端點防護與最小權限原則，可建議客戶定期盤點虛擬化/遠端工作環境並套用安全基線。","refs":[{"name":"iThome","url":"https://www.ithome.com.tw/news/179045"},{"name":"iThome 資安日報","url":"https://www.ithome.com.tw/news/179059"}]},{"id":10,"title":"商周集團網站遭惡意攻擊一週後，主站基礎服務恢復運作","tags":["security"],"summary":"上週商周集團公告旗下網站遭惡意攻擊，導致線上服務中斷。9/16 商發布新公告，表示主網站基礎服務已恢復，提供最新一期雜誌內容及 9/8 之前的免費新聞與付費深度報導，但由於其他系統仍在重建，9/9 之後的新文章暫無法閱讀；商周財富網、良醫健康網等子公司網站尚在驗證中。商周強調絕不會要求讀者進行 ATM、網路銀行或轉帳等金融操作，提醒防範攻擊衍生的詐騙，事件突顯資安對營運韌性的衝擊。","sales_tip":"媒體/網站營運中斷案例可用以說服客戶投資災害復原、網站維護與備援，強調「營運韌性」「資安事件應變」與對外溝通機制的重要。","refs":[{"name":"iThome","url":"https://www.ithome.com.tw/news/179056"},{"name":"iThome 資安日報","url":"https://www.ithome.com.tw/news/179059"}]}]};
