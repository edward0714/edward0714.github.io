.com/advisories/"}]}, {"id": 9, "title": "歐盟 CRA 全面適用倒數 15 個月，臺灣企業須提早合規準備", "tags": ["it"], "summary": "歐盟網路韌性法（CRA）全面適用進入倒數 15 個月，西班牙候選公告機構（NB）Applus+ Laboratories 呼籲企業及早展開產品分類與合規準備。CRA 對具數位元件的有形產品課予資安需求，產品分類將決定後續符合性評估路徑，企業須接著進行風險評估、技術文件準備與既有測試結果盤點，並留意最後階段集中送驗可能造成的驗證量能瓶頸。", "sales_tip": "可主攻臺灣硬體與物聯網業者，提供 CRA 資安評估、滲透測試與技術文件輔導，提前卡位合規服務商機。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/179218"}, {"name": "歐盟數位策略", "url": "https://digital-strategy.ec.europa.eu/en/policies/cyber-resilience-act"}]}, {"id": 10, "title": "AWS CloudWatch Omni 將 AI 代理品質納入監控與比較", "tags": ["it"], "summary": "AWS 宣布 CloudWatch Omni 納入 AI 代理品質測試能力，可把代理的回答品質、工具選擇與執行過程納入 CloudWatch 監控，讓開發團隊能以實際執行紀錄建立測試資料集，並比較提示詞、模型與代理版本變更前後的表現。這為企業導入 AI 代理提供了品質與可觀測性的標準化管理工具，是 Agentic AI 走向營運化的關鍵一步。", "sales_tip": "可用「AI 代理也要可觀測」切入企業可觀測性（Observability）與 AIOps 方案，補足代理上線後的品質管理缺口。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/179226"}, {"name": "AWS CloudWatch", "url": "https://aws.amazon.com/cloudwatch/?nc1=h_ls"}]}]};
