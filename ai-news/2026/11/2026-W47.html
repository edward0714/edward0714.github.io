": [{"name": "iThome（Wellington IT 波及 40 家）", "url": "https://www.ithome.com.tw/news/180665"}, {"name": "iThome（富邦媒 mo 店+ 事件）", "url": "https://www.ithome.com.tw/news/180656"}, {"name": "iThome（大車隊子公司遭未經授權存取）", "url": "https://www.ithome.com.tw/news/180662"}, {"name": "iThome 資安週報 1116～1120", "url": "https://www.ithome.com.tw/news/180681"}]}, {"id": 4, "title": "重大漏洞連環爆，揭露期限縮至 30 天", "tags": ["security"], "summary": "本週多項重大漏洞遭實際利用：中國駭客組織 Armory Castle 利用 VMware vCenter 零時差漏洞 CVE-2026-123890，最早可追溯至 9 月初，以自製 Go 工具 BoneSaw 竊取 vCenter 內部 LMDB 資料庫與 SAML 簽章私鑰，再以 SawSnake 偽造權杖冒用管理員；博通 11/19 修補且無替代緩解。Oracle 修補 OpenJDK 的 Java4Shell（CVE-2026-114938，CVSS 9.2），通報者 Calif.io 用 AI 在 1 小時內找到漏洞、2 小時做出利用鏈，Token 成本不到 200 美元，可對 Keycloak、Jira、Confluence、Jenkins 等系統未經驗證 RCE。同週 PHP 修補 18 個漏洞（7 個 9.2 分）、Ruby 修補 7 個記憶體漏洞。因應 AI 加速攻擊，Project Zero 宣布揭露期限 2027 縮至 60 天、2028 縮至 30 天，Anthropic 自 2027 年起重大漏洞縮至 30 天。", "sales_tip": "「修補窗口從兩週變幾小時」最好賣：推 72 小時修補 SLA＋資產清單＋AI 輔助源碼掃描三件套。", "refs": [{"name": "iThome（Armory Castle 利用 vCenter 零時差）", "url": "https://www.ithome.com.tw/news/180674"}, {"name": "iThome（Java4Shell 細節）", "url": "https://www.ithome.com.tw/news/180601"}, {"name": "iThome（PHP 修補 18 個漏洞）", "url": "https://www.ithome.com.tw/news/180678"}, {"name": "iThome（Project Zero 重訂揭露時程）", "url": "https://www.ithome.com.tw/news/180531"}]}, {"id": 5, "title": "微軟 Ignite 2026 一次推 7 款自研模型", "tags": ["ai"], "summary": "微軟在 Ignite 2026 一口氣推出 7 款自研模型，主軸從「效能更好」轉向「把企業長期 AI 成本壓低」。MAI Code 2 主打企業日常程式開發，宣稱效能達 GPT-6.1 Sol 的 98%，完成任務成本約只有 40%；MAI Cyber 2 Flash 用於持續監控、漏洞掃描與修補，在 CyberGymE2E 測試與 GPT-6 Astra 相當，成本卻不到 2%。另有 MAI Image 2.7、鎖定低延遲語音的 MAI Realtime 1，以及負責挑選合適模型的 Decision 1.1；同步推出 MAI Licensed Weights，企業可取得權重於自有 Azure 環境部署與客製，保留資料與模型成果控制權。", "sales_tip": "客戶喊「AI 太貴」時就舉這則：改用專用小模型＋模型路由，先把 Token 成本砍半，再談場景擴充。", "refs": [{"name": "iThome AI 趨勢週報第 295 期", "url": "https://www.ithome.com.tw/news/180669"}, {"name": "Microsoft AI 官方部落格（Ignite 2026）", "url": "https://microsoft.ai/news/microsoft-ignite-2026/"}]}, {"id": 6, "title": "OpenAI GPT-6.2 雙模型，Astra 首達自我改進高風險", "tags": ["ai"], "summary": "OpenAI 11/17 推出 GPT-6.2 Astra 與 GPT-6.2 Sol。Astra 鎖定程式開發、科學研究、財務分析與專業文件，能更準確遵循企業範本產出簡報與試算表，在 Agents' Last Exam 比前代高 5.2 分、成本不到 1/3，API token 價格降 20%；Sol 主打日常與成本效率，在 FrontierCode 2.0 僅落後 Astra 約 0.5 分，任務成本約 1/5。最受關注的是 Astra 成為 OpenAI 首款達到「AI 自我改進」高風險門檻的對外模型，OpenAI 形容其研究助力等於替每位研究員多配一名研究工程師；兩款的網路安全能力均達 Critical 門檻、生物與化學能力達 High。", "sales_tip": "順著「能力已跨門檻」的敘事，推 AI 使用政策、模型選擇矩陣與人工覆核點設計，先談治理再談導入。", "refs": [{"name": "iThome（GPT-6.2 雙模型）", "url": "https://www.ithome.com.tw/news/180605"}, {"name": "OpenAI 官方公告", "url": "https://openai.com/index/introducing-gpt-6-2-astra-sol/"}]}, {"id": 7, "title": "Gemini 4 Hydrogen 上線，速度快 2.5 倍", "tags": ["ai"], "summary": "Google 11/13 公布輕量模型 Gemini 4 Hydrogen，定位一般程式撰寫與每日代理式工作流，執行速度比前代 3.8 Flash 快 2.5 倍，Terminal-Bench 4.1 得分為 3 倍、捏造回應情況少 5 倍，在工具呼叫失敗或搜尋不到內容時也能有效處理。模型提供低、中、高與新增 xhigh 四種思維等級，可搭配 Carbon、Argon 做多模型分工，由 Hydrogen 寫程式、修 bug、跑測試，Carbon 負責較複雜的系統架構判斷。已推向 Google App、搜尋、AI Studio、Gemini API 與企業版 Gemini，均一價每百萬 token 輸入 1.5 美元、輸出 7.5 美元；合作夥伴早期測試顯示企業工作流快 2 到 2.8 倍、token 少 12% 至 23%。", "sales_tip": "POC 設計改成「大模型定架構、Hydrogen 跑客語」：同一筆預算跑更多流程，成效最好量化。", "refs": [{"name": "iThome（Gemini 4 Hydrogen）", "url": "https://www.ithome.com.tw/news/180516"}, {"name": "Google 官方部落格", "url": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/"}]}, {"id": 8, "title": "日月光用多 Agent 串起良率預測流程", "tags": ["ai", "it"], "summary": "日月光 11/10 宣布與 SAS 合作導入 SAS Viya 平臺，整合分散各處的資料、模型、演算法與 AI Agent，並選定良率預測做多 Agent 概念驗證。使用者以自然語言提出良率問題後，平臺協調不同 Agent 與工具，串起資料處理、特徵工程、模型訓練、部署與評分等步驟；最大價值在於不必把長年累積的既有模型與元件打掉重做，由平臺統一調度管理。平臺同時整合 ModelOps 與 Agent 管理機制，可追蹤版本、效能與執行紀錄，保留決策流程可追溯性，並把資深工程師的製程判斷與異常處理經驗沉澱為可複用資產。目前尚未公布量化成效。", "sales_tip": "製造業最強素材：「Agent 不動既有模型、只負責調度」，先賣治理與追溯，再賣場景。", "refs": [{"name": "iThome AI 趨勢週報第 295 期", "url": "https://www.ithome.com.tw/news/180669"}, {"name": "TechOrange（日月光攜手 SAS）", "url": "https://techorange.com/2026/11/10/asegroup-sas-viya-agenticai/"}]}, {"id": 9, "title": "AI 代購來襲，零售業促訂 Agent 交易規則", "tags": ["ai"], "summary": "AI Agent 已能替消費者比價、下單甚至付款。中華民國無店面零售商業同業公會 11/9 率 30 多家企業代表與數發部座談，momo 總經理谷元宏提出三個必答題：Agent 究竟被授權做到哪裡、出錯後責任由誰承擔、商家如何驗證這個 AI 代理的身分。數發部回應將研議「電商產業 AI 應用風險框架」並邀產業提供實務意見。國際已有對應機制：Google 的 Agent Payments Protocol 可讓使用者設定品牌、商品與預算上限，Visa 的 Trusted Agent Protocol 則讓商家以可驗證數位簽章辨識可信任購物 Agent；臺灣目前仍處於產業倡議與政府研議階段，尚無正式規範。", "sales_tip": "零售客戶先做「Agent 授權範圍＋交易留存紀錄」設計，這是未來合規的最低門票，也是差異化賣點。", "refs": [{"name": "iThome AI 趨勢週報第 295 期", "url": "https://www.ithome.com.tw/news/180669"}, {"name": "BigGo 財經（無店面公會座談）", "url": "https://finance.biggo.com.tw/news/da8d3150-af6d-4632-b29f-2cfeaa3d371a"}]}, {"id": 10, "title": "Microsoft 365 全球當機 30 小時，確認與 AI 無關", "tags": ["it"], "summary": "Microsoft 365 於臺灣時間 11/12 18:05 至 11/14 00:10 發生全球大規模中斷，歷時 30 小時 5 分鐘，影響 Exchange Online、Teams、SharePoint Online、Microsoft 365 Copilot 與 Windows 365，醫療、警政與教育機構也受波及。微軟說明，例行網路容量升級留下技術瑕疵，在後續網路變更轉移流量時被觸發，導致大量連線請求累積、處理 Exchange Online 連線的伺服器負荷過重而無法接受新連線，Teams 等服務因相依性連帶受影響；因需求龐大僅能分階段恢復。微軟強調事故與網路攻擊、AI 或 AI 代理無關，並承諾 2 個工作天內提供初步報告、5 個工作天內公布最終報告。", "sales_tip": "對 IT 主管談「單一雲服務中斷 30 小時」的營運衝擊：推跨雲備援、郵件異地備援與 RTO 演練。", "refs": [{"name": "iThome（M365 當機逾 30 小時）", "url": "https://www.ithome.com.tw/news/180511"}, {"name": "iThome（微軟揭露當機原因）", "url": "https://www.ithome.com.tw/news/180549"}]}]};
