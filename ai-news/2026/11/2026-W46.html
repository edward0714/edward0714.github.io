const D = {"week": "2026-W46 (11/09-11/15)", "generated_at": "2026-11-14T10:00:00+08:00", "source_note": "資料來源：iThome Taiwan、資安新聞網站、AI 熱門媒體", "topics": [{"id": 1, "title": "Cyberbiz 事件擴大，13 家上市櫃公司連環公告", "tags": ["security"], "summary": "電商開店平臺 Cyberbiz 遭駭風波進入第二週，諾貝兒寶貝、臺鹽、宏碁智新、展碁國際、倚天酷碁、遠東生技、崇越、曜亞、威力德生醫、台灣櫻花、和泰車、黑松、漢來美食等至少 13 家上市櫃與興櫃公司陸續發布資安重訊，說明會員資料可能受影響。Cyberbiz 至今未揭露實際受影響客戶家數，外界普遍認為目前曝光只是冰山一角；同一週還有 netiCRM、1shop、meepShop、莫筆克等委外業者傳出事件，顯示委外服務供應鏈已是臺灣企業最集中的風險破口。", "sales_tip": "用「委外供應商清單＋合約資安條款＋常態化通報機制」切入，一家客戶名單就是最好的報價依據。", "refs": [{"name": "iThome 資安週報 1109～1113", "url": "https://www.ithome.com.tw/news/180500"}, {"name": "iThome 資安週報 1102～1106", "url": "https://www.ithome.com.tw/news/180291"}]}, {"id": 2, "title": "外交部領務局網站遭駭，7.2 萬筆護照照片外洩", "tags": ["security"], "summary": "外交部領事事務局揭露部分網站遭駭，確認三類民眾個資被未經授權取得：7 萬 2,702 個護照大頭照檔案、2 萬 6,072 個駐紐約辦事處驗證的授權書掃描檔，以及 774 件 APEC 商務旅行卡（ABTC）申請案。領務局表示部分系統由委外廠商維運，不排除向廠商求償。此案與同期多家上市櫃公司重訊相互呼應，個資法通報義務、衝擊評估與損害賠償責任成為公部門與企業共同關注焦點。", "sales_tip": "公部門與金融客戶最在意「通報時限」：主打個資盤點、外洩衝擊評估與事件應變演練 SOP 的組合包。", "refs": [{"name": "iThome（領務局個資外洩）", "url": "https://www.ithome.com.tw/news/180446"}, {"name": "iThome 資安週報 1109～1113", "url": "https://www.ithome.com.tw/news/180500"}]}, {"id": 3, "title": "netiCRM 服務商遭駭，500 家 NGO 主機全面重建", "tags": ["security"], "summary": "捐款管理系統 netiCRM 服務商網絡行動科技遭駭，入侵的內部管理主機具有其他主機的管理權限，因此 500 多家非營利組織客戶的主機全數納入檢查與重建範圍。業者確認 NGO 客戶的聯絡人、方案、帳務資料與客服紀錄遭竊，但尚未發現捐款人資料外洩。事件初期公督盟、司改會等 30 多個團體接力示警；業者在尋求外部資安支援時，更坦言廠商回應「無人力可支援」，凸顯國內資安事件應變量能不足。", "sales_tip": "「資安救火隊缺工」是最佳切入點：談 MDR 託管服務與事件應變年約，把量能不足轉為預算。", "refs": [{"name": "iThome（netiCRM 500 家客戶）", "url": "https://www.ithome.com.tw/news/180447"}, {"name": "iThome（30 多個 NGO 示警）", "url": "https://www.ithome.com.tw/news/180384"}]}, {"id": 4, "title": "AI 自動化攻擊系統 BossAI 鎖定臺灣緊急應變服務", "tags": ["ai", "security"], "summary": "資安業者 Acronis 揭露 AI 自動化攻擊系統 BOSSAI，整合 12 個 AI 代理、MCP 與 Skills，12 天內鎖定全球 11 國數百個組織，臺灣、墨西哥、泰國有明確攻擊活動。臺灣受害案例包括臺北市消防緊急病患照護記錄平臺資料可能外洩、119 緊急派遣系統遭入侵並存取 7 個行政區案件記錄，以及貸款公司遭 SQL 注入、行動支付業者 CVV 驗證缺失。高雄警方另查出民眾透過 AI 學會架設自動化攻擊系統，竊取逾 23 萬筆個資販售。", "sales_tip": "用「攻擊已自動化、防禦還在人工」開場，推 SOAR 自動化應變＋外部曝險監控，規模化最容易被接受。", "refs": [{"name": "iThome（BossAI 鎖定臺灣）", "url": "https://www.ithome.com.tw/news/180304"}, {"name": "iThome（BossAI 運作細節）", "url": "https://www.ithome.com.tw/news/180310"}, {"name": "iThome（高雄 AI 攻擊系統）", "url": "https://www.ithome.com.tw/news/180317"}]}, {"id": 5, "title": "中國駭客以 AI 代理框架 Cairn 打進立法院、法務部", "tags": ["security", "ai"], "summary": "獨立研究團隊 Vulone 揭露與中國相關的駭客組織使用 AI 代理框架 Cairn，對臺灣、越南、印尼、印度等亞洲多國政府機關與企業發動大規模入侵。臺灣是主要目標之一：駭客利用 CGI 命令注入漏洞入侵立法院法律系統並取得命令執行權限，再透過未經驗證的檔案管理功能在法務部相關系統上傳 WebShell。微軟同期揭露駭客以代理型 AI 大量搜尋 GitHub 上的外洩憑證，從登入雲端環境到外傳 Azure Key Vault 資料僅花 5 分鐘。", "sales_tip": "政府與關鍵基礎設施案必問「AI 代理能不能自己找漏洞」，主打源碼掃描、WAF 與憑證治理三合一。", "refs": [{"name": "iThome（Cairn 入侵立院、法務部）", "url": "https://www.ithome.com.tw/news/180314"}, {"name": "iThome（微軟：5 分鐘外傳 Key Vault）", "url": "https://www.ithome.com.tw/news/180400"}]}, {"id": 6, "title": "Google：AI 讓攻擊自動化，企業必須管好 Agent 權限", "tags": ["ai", "security"], "summary": "Google 威脅情報小組（GTIG）技術長 Shane Huntley 在 HITCON CISO Summit 指出，AI 未改變攻擊本質，卻讓原本需要大量人力的工作可在數小時內完成：從取得存取權、多代理協同到大量蒐集憑證可能不到六小時，企業過去認為風險不高、可延後修補的弱點如今都可能成為入口。他主張 AI Agent 必須比照員工管理——只給完成任務所需的最小權限，建立日誌、稽核與人工監督，並納入既有身分識別與存取管理架構。", "sales_tip": "這是 MaiAgent 導入案最好的治理素材：先賣「Agent 身分＋最小權限＋操作留存」三件套，再談應用情境。", "refs": [{"name": "iThome（Google 談 Agent 權限）", "url": "https://www.ithome.com.tw/news/180481"}, {"name": "iThome（Google 預測 2027 資安趨勢）", "url": "https://www.ithome.com.tw/news/180372"}]}, {"id": 7, "title": "Fortinet2Shell 與 Able2Shell 夾擊，端點與 RMM 成破口", "tags": ["security"], "summary": "Fortinet 公布 FortiClient 重大漏洞 CVE-2026-121529（Fortinet2Shell）細節，通報研究人員指出攻擊者只要引誘使用者存取惡意網站，就有機會在受害電腦執行任意程式碼；該公司同時揭露 10 月底的更新共修補 100 個漏洞，近五分之一屬重大等級，涵蓋 FortiOS、FortiManager、FortiAnalyzer、FortiMail 等。另一厢 N-able 旗下 N-central 被揭露統稱 Able2Shell 的 33 個零時差漏洞，已登記 7 個 CVE 並出現實際利用活動，迫使業者緊急關閉雲端服務。", "sales_tip": "這兩案適合打「VPN／端點／RMM 三大邊界盤點」：用資產清單與修補 SLA 報表證明常態治理的價值。", "refs": [{"name": "iThome（Fortinet2Shell 細節）", "url": "https://www.ithome.com.tw/news/180464"}, {"name": "iThome（Fortinet 修補 100 漏洞）", "url": "https://www.ithome.com.tw/news/180460"}, {"name": "iThome（Able2Shell 已遭利用）", "url": "https://www.ithome.com.tw/news/180439"}]}, {"id": 8, "title": "台積電 4.6 萬筆員工紀錄遭兜售，指向第三方雲端供應商", "tags": ["security", "it"], "summary": "地下論壇有人聲稱取得約 4.6 萬筆台積電現職與離職員工紀錄、檔案約 6.9 GB，開價 3 個比特幣（約 20 萬美元），內容含聯絡方式、身分證件與銀行帳務資料。台積電 11/12 向美國 SEC 遞交說明，確認部分員工資料與某雲端服務供應商系統中的資料相符，但無證據顯示公司自有系統遭入侵，資料與營運及客戶無關，已通知受影響員工並與供應商、調查機關及第三方資安業者合作釐清。此案再次印證委外與雲端資料治理的邊界風險。", "sales_tip": "半導體與製造業客戶請直接談「供應商資料落地範圍＋資料離開條款」，把合規稽核寫進續約條件。", "refs": [{"name": "iThome（台積電回應）", "url": "https://www.ithome.com.tw/news/180450"}, {"name": "The Record（TSMC 確認雲端供應商洩漏）", "url": "https://therecord.media/tsmc-confirms-employee-data-breach-cloud-provider"}, {"name": "TSMC SEC 申報", "url": "https://www.sec.gov/Archives/edgar/data/1046179/000104617926000800/a20261112statementregardin.htm"}]}, {"id": 9, "title": "Google 推醫療版 Gemini，串接 Epic、Oracle 電子病歷", "tags": ["ai"], "summary": "Google Cloud 11/10 在美國開放預覽 Gemini for healthcare，主打以 AI Agent 串接破碎的臨床、營運與行政系統：可跨系統查找病歷、藥品、臨床指引與保險給付規則，協助整理病史、看診前備妥病歷摘要、準備事前授權與理賠申覆文件。方案內建 27 個連接器，涵蓋 Epic、Oracle Health、InterSystems FHIR Server、CMS Coverage、ICD-10、RxNorm 等，並與 16 家系統整合商合作；臨床資料以唯讀方式存取，留在客戶受治理的 Google Cloud 環境中。", "sales_tip": "醫療與保險是 Agent 落地最快的垂直領域：以「讀取型 Agent＋連接器清單」界定 POC 範圍，降低合規阻力。", "refs": [{"name": "iThome（醫療版 Gemini）", "url": "https://www.ithome.com.tw/news/180431"}, {"name": "Google Cloud 官方部落格", "url": "https://cloud.google.com/blog/products/ai-machine-learning/gemini-for-healthcare"}, {"name": "Google Cloud 新聞稿", "url": "https://www.googlecloudpresscorner.com/2026-11-10-Google-Cloud-Launches-Gemini-for-Healthcare"}]}, {"id": 10, "title": "Google 攜三星推 Gemini 智慧眼鏡，12/10 開賣挑戰 Meta", "tags": ["ai", "it"], "summary": "Google 與三星 11/12 開放預購 Intelligent Eyewear，由 Warby Parker 與 Gentle Monster 設計，共 9 款、30 種設計變化，12 月 10 日在美國與韓國開賣。眼鏡重量約 41 公克、續航 9 小時（搭配充電盒可達 72 小時），內建 Gemini，支援即時翻譯、導航、拍照與通知摘要；12MP HDR 相機搭配錄影指示 LED，LED 失效或被遮蔽時會直接禁用相機，並對旁觀者臉部進行遮蔽、視覺資料不用於模型訓練。Warby Parker 款 395 美元起、Gentle Monster 款 449 美元起。", "sales_tip": "硬體即入口的敘事回歸：向客戶談「穿戴式 Agent 的語音與視覺資料治理」，是最容易引起興趣的開場。", "refs": [{"name": "iThome（Google 攜三星推智慧眼鏡）", "url": "https://www.ithome.com.tw/news/180473"}, {"name": "Samsung Newsroom 官方", "url": "https://news.samsung.com/global/samsung-announces-december-release-for-intelligent-eyewear-bringing-a-smarter-way-to-see-the-world"}, {"name": "Google 官方部落格", "url": "https://blog.google/innovation-and-ai/technology/xr-ar/google-intelligent-eyewear-collections-pre-order/"}]}]};
