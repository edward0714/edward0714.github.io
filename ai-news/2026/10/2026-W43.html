const D = {"week": "2026-W43 (10/19-10/25)", "generated_at": "2026-10-24T10:00:00+08:00", "source_note": "資料來源：iThome Taiwan、資安新聞網站、AI 熱門媒體", "topics": [{"id": 1, "title": "PHP2Shell 漏洞風暴，2.8 萬台灣網站受影響", "tags": ["security"], "summary": "PHP 官方 10/20 修補 CVE-2026-109618、CVE-2026-109619 兩個 CVSS 9.2 分 RCE 漏洞。漏洞資訊提前外流，PHP2Shell 利用工具已現。數發部統計國內約 2.8 萬個對外網站受影響，其中約 200 個政府機關網站，已要求優先修補、必要時暫停服務。", "sales_tip": "主動提供客戶 PHP 版本盤點與 WAF 虛擬補丁服務，把「修補不及」的焦慮轉成託管服務商機。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/179861"}, {"name": "iThome（數發部）", "url": "https://www.ithome.com.tw/news/179891"}, {"name": "iThome（眾至資訊）", "url": "https://www.ithome.com.tw/news/179924"}]}, {"id": 2, "title": "Zeabur 二度遭駭，321 萬筆環境變數外洩", "tags": ["security"], "summary": "台灣雲端部署平台 Zeabur 10/14 再遭入侵，10/19 公布調查：攻擊者經共享叢集與 GCP 專用伺服器兩條路徑，讀取逾 321 萬筆環境變數、32 萬筆帳號資料，並取得 53 筆正式環境機密。根因是管理介面開放公網、權杖無期限，且憑證未輪替。平台宣布 12/31 前關閉。", "sales_tip": "以本案說明「憑證生命週期管理與零信任」不是口號，可切入特權帳號管理與雲端安全健檢。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/179804"}, {"name": "Zeabur 調查報告", "url": "https://zeabur.com/zh-TW/blogs/october-2026-security-incident"}]}, {"id": 3, "title": "OpenAI 模型上架 Google Cloud", "tags": ["ai", "it"], "summary": "OpenAI 與 Google Cloud 10/21 宣布合作，把 OpenAI 前沿模型與 Codex 代理工作流帶進 Model Garden，企業可在既有 GCP 環境原生取用，並以 GCP 承諾用量折抵。Microsoft 仍是主要雲端夥伴，顯示多雲多模型已成企業 AI 常態。", "sales_tip": "客戶若卡在單一模型綁定，可用「多模型路由＋成本治理」框架切入 AI 平台中介層需求。", "refs": [{"name": "OpenAI 官方", "url": "https://openai.com/index/openai-models-google-cloud/"}, {"name": "Google Cloud Blog", "url": "https://cloud.google.com/blog/products/ai-machine-learning/google-cloud-brings-openai-models-to-customers"}]}, {"id": 4, "title": "NVIDIA 發表 DSX POD 貨櫃式 AI 工廠", "tags": ["ai", "it"], "summary": "NVIDIA 執行長黃仁勳 10/21 於 GTC 柏林宣布 DSX POD，為完整的 Vera Rubin AI 工廠參考設計，由夥伴在模組化貨櫃內建置、驗證後交付，訴求數天內就能開一座 AI 工廠。DSX 冷卻用水可減最高 100%、相同 AI 產出用電少 30%。", "sales_tip": "對製造與資料中心客戶談「貨櫃化、模組化部署」可縮短導入時程，帶入能源管理與維運方案。", "refs": [{"name": "NVIDIA Blog", "url": "https://blogs.nvidia.com/blog/gtc-berlin-2026-keynote/"}, {"name": "NVIDIA Newsroom", "url": "https://nvidianews.nvidia.com/news/nvidia-introduces-dsx-pod-ai-factories-to-accelerate-europes-infrastructure-deployment"}]}, {"id": 5, "title": "MIC：AI 伺服器出貨上看 450 萬台", "tags": ["it", "ai"], "summary": "資策會 MIC 發布 2026 年十大科技趨勢，預期 AI 需求帶動 3 奈米以下先進製程產能，AI 伺服器出貨可達 450 萬台、約占整體 1,500 萬台的三成。製造、醫療等場景對低延遲 AI 需求浮現，加上 AI Box 產品線齊備，預估 2026 年邊緣 AI 硬體滲透率接近 2 成。", "sales_tip": "用「邊緣 AI 滲透率近 2 成」的數據，向製造客戶提出地端推論與 AI Box 導入評估。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/172908"}, {"name": "資策會 MIC", "url": "https://mic.iii.org.tw/news.aspx?id=746"}]}, {"id": 6, "title": "91APP 資料庫遭自動化攻擊，已報案通報", "tags": ["security"], "summary": "電商技術服務商 91APP（6741）10/16 發布重大訊息，旗下 Commerce Cloud 資料庫 10/14 遭自動化攻擊，攻擊者非法擷取部分資訊。公司已委請第三方資安單位調查、報警、採取防護並依法通報主管機關，目前攻擊已獲控制，初步評估對營運無重大影響，並加強反詐騙宣導。", "sales_tip": "向零售客戶強調資料庫活動監控（DAM）與異常查詢告警，是防堵自動化大量擷取的關鍵。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/179741"}, {"name": "公開資訊觀測站", "url": "https://mopsov.twse.com.tw/mops/web/t05sr01_1"}]}, {"id": 7, "title": "UAT-11985 以 AiTM 網釣鎖定台灣研究機構", "tags": ["security"], "summary": "思科 Talos 揭露中國駭客 UAT-11985 針對台灣研究機構發動 APT 網釣，假冒台灣歐盟中心、政大國關中心與智庫名義，以地緣政治分析建立專業形象，再以專屬邀請、VIP 席位誘使點擊。攻擊者用仿冒 Google 登入頁的 AiTM 框架，即時切換密碼、通行金鑰與 MFA 畫面。", "sales_tip": "對研究機構與高科技客戶談「FIDO2 通行金鑰優於簡訊 OTP」，是繞過 AiTM 的具體對策。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/179769"}, {"name": "Cisco Talos", "url": "https://blog.talosintelligence.com/uat-11985/"}]}, {"id": 8, "title": "OWASP：AI 代理過度授權升至第 3 名", "tags": ["ai", "security"], "summary": "OWASP 公布 2026 年 LLM 十大風險，首度納入「事故資料」，並把 AI 代理過度授權升至第 3 名，反映企業部署自主代理後，權限蔓延與不可逆操作成為主要破口。G7 研究顯示，2025 年 10 月至 2026 年 3 月 G7 資安職缺需求年增 9.5%，資深職缺增 65%。", "sales_tip": "用 OWASP 清單當健檢表，向客戶提供「代理權限最小化與人工覆核」的治理顧問服務。", "refs": [{"name": "iThome（OWASP）", "url": "https://www.ithome.com.tw/news/178451"}, {"name": "iThome（G7 職缺）", "url": "https://www.ithome.com.tw/news/178338"}]}, {"id": 9, "title": "Zoom 推統一上下文層，企業 AI 走向代理人", "tags": ["ai"], "summary": "Zoom 推出全新「統一上下文層」，把會議、聊天、文件與任務資料串成單一上下文，讓 AI 不再只是會後摘要，而能依會議結論直接生成任務、追蹤待辦並推進流程。同期 SailPoint 創辦人 Mark McClain 來台指出，AI 普及速度正受制於安全性不足，呼籲導入代理同時投入身分治理。", "sales_tip": "向客戶示範「會議結論直接生成任務」可量化省下的行政工時，並同步談代理權限治理。", "refs": [{"name": "iThome（Zoom）", "url": "https://www.ithome.com.tw/pr/179938"}, {"name": "iThome（SailPoint）", "url": "https://www.ithome.com.tw/news/179760"}]}, {"id": 10, "title": "Fortinet、Nginx 修補漏洞，邊界設備成熱點", "tags": ["security", "it"], "summary": "Fortinet 10/22 同步修補涵蓋 5 大產品系列的多項漏洞；Nginx 也修補 5 項漏洞，其中 3 項可能導致遠端程式碼執行。駭客組織 UNC5820 鎖定電信公司，利用 Fortinet 漏洞散布惡意軟體 PeerStitch。邊界設備與遠端存取閘道仍是 APT 偏好的初始入侵點。", "sales_tip": "以「邊界設備盤點＋EoL 汰換」為題，向客戶推動防火牆與 VPN 閘道的資產健檢與更新計畫。", "refs": [{"name": "iThome（Fortinet）", "url": "https://www.ithome.com.tw/news/179876"}, {"name": "iThome（Nginx）", "url": "https://www.ithome.com.tw/news/179759"}, {"name": "iThome（UNC5820）", "url": "https://www.ithome.com.tw/news/179767"}]}]};
