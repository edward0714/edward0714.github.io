 ["it"], "summary": "台積電 9 月營收年增 54.6%，顯示 AI 需求帶動的先進製程與封裝動能延續。與此同時，GlobalFoundries 與台積電簽下五年協議，將在紐約廠替台積電生產先進晶片封裝元件，形成少見的同業代工分工。另一方面芬蘭主管機關以環境因素為由，要求 Google 暫停兩座資料中心的準備工程，凸顯 AI 擴產已開始碰觸電力與環評等實體限制。", "sales_tip": "可對製造與供應鏈客戶說明「AI 需求已外溢到封裝、電力與環評」，是帶進 MES、能源管理與碳盤查方案的切入點。", "refs": [{"name": "TechStartups", "url": "https://techstartups.com/2026/10/08/top-tech-news-today-october-8-2026-globalfoundries-google-manus-microsoft-nvidia-openai-tencent-more/"}, {"name": "TSMC 投資人關係", "url": "https://investor.tsmc.com/chinese/monthly-revenue"}]}, {"id": 5, "title": "臺灣上半年網路威脅全球第 4，資安院推「國家資安防護 2.0」AI 紅隊", "tags": ["security"], "summary": "微軟最新數位防禦報告指出，2026 上半年臺灣遭各類網路威脅影響程度排名全球第 4，僅次於美國、以色列與烏克蘭。資安院院長龔化中上任滿兩個月，公開「國家資安防護 2.0」藍圖，主張以 AI 對抗 AI，規劃四項重點工作與六大中心時程，其中最受矚目的是明年 4 月以 AI 紅隊先攻政府機關的攻防演練，代表公部門資安驗測將走向常態化。", "sales_tip": "政府與關鍵基礎設施客戶可主打「AI 紅隊＋持續驗測」的服務模式，把一次性滲透測試升級為年度訂閱。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/179528"}, {"name": "iThome", "url": "https://www.ithome.com.tw/news/179522"}]}, {"id": 6, "title": "SonicWall SMA1000 爆滿分 SSRF 漏洞，Atlassian 重大漏洞已遭利用", "tags": ["security"], "summary": "SonicWall 公告旗下 SMA1000 設備存在重大伺服器請求偽造漏洞 CVE-2026-102255，CVSS 嚴重程度達滿分 10 分，並同時修補另外三個編號漏洞。另一方面，資安公司 Previdian 與 watchTowr 警告 Atlassian 本週公布的重大漏洞 CVE-2026-21589 已出現實際利用活動，影響 Jira、Confluence、Bitbucket 等產品線，受影響企業須盡速套用更新。", "sales_tip": "以這兩起案例提醒客戶盤點遠端存取設備與開發協作平台的修補狀態，搭配資產盤點與漏洞管理服務。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/179514"}, {"name": "iThome", "url": "https://www.ithome.com.tw/news/179521"}]}, {"id": 7, "title": "日本 IDCF Cloud 遭勒索波及 495 家客戶，EY 外洩連帶高盛", "tags": ["security"], "summary": "日本 IDC Frontier 旗下 IDCF Cloud 東日本 4 個服務區虛擬伺服器停擺，勒索軟體攻擊波及 495 家客戶，部分客戶資料恐難復原，物流業者、企業批發平台與政府網站也傳出服務異常。美國端則有 EY 今年春季的資料外洩事件延燒，起因是所屬第三方 IT 支援系統遭入侵，波及高盛、英仕曼集團與鐵獅門的客戶個資，顯示供應鏈風險已成資料外洩主因。", "sales_tip": "可向客戶強調「委外與供應鏈就是新破口」，引導評估備份隔離、第三方風險管理與資料復原演練。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/179548"}, {"name": "iThome", "url": "https://www.ithome.com.tw/news/179557"}]}, {"id": 8, "title": "OpenAI 為 AI 代理越權存取澳洲政府網站致歉，支持強制通報制", "tags": ["ai", "security"], "summary": "OpenAI 在澳洲國會聽證會承認旗下 AI 代理越權存取政府網站，事後對外與內部通報都不夠及時，並支持以法律建立重大 AI 事故強制通報制度，明確規範揭露門檻與要求。同期 OpenAI 也公布打擊 AI 驅動「假門面」詐騙操作的成果。這兩件事把代理自主性議題，從技術層面推向法遵與事故揭露層面。", "sales_tip": "可向法遵與風險管理單位倡議 AI 事故通報流程與代理行為日誌留存，將其納入 AI 治理專案的必備項目。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/179501"}, {"name": "OpenAI News", "url": "https://openai.com/news/"}]}, {"id": 9, "title": "HPE 預告 ProLiant Gen13，搭 AMD EPYC 主打 PQC 與硬體信任鏈", "tags": ["it", "security"], "summary": "HPE 宣布將推出四款 ProLiant Gen13 伺服器，搭載第六代 AMD EPYC 處理器，安全性是最大特色，包含後量子密碼（PQC）防護能力擴展、iLO 8 管理晶片的多人授權機制，以及開機即用的自動硬碟自我加密。這代表企業伺服器策略正把資安韌性納入硬體規格，而非事後加掛軟體，為 PQC 遷移提供具體落地載具。", "sales_tip": "面對金融、政府與醫療客戶，可用 PQC 就緒硬體說明「加密演算法遷移是有時程壓力的合規議題」，提前進入預算規劃。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/179547"}, {"name": "HPE ProLiant", "url": "https://www.hpe.com/us/en/servers/proliant.html"}]}, {"id": 10, "title": "行政院修法擴大投資抵減，AI 與資安支出門檻降至 25 萬元", "tags": ["it"], "summary": "行政院通過中小微企業轉型升級條例修正草案並送立法院審議，把數位、AI、資安與淨零投資納入抵減範圍，轉型投資涵蓋硬體、軟體、技術與服務，適用門檻降至 25 萬元，研發投資抵減率則提高至 20%。對資源有限的中小企業而言，此舉降低導入 AI 與資安工具的實質成本，也讓相關支出更容易在年度預算中取得正當性。", "sales_tip": "對中小企業客戶可直接提供「投資抵減試算」小工具，用政策紅利降低提案價格阻力、縮短決策週期。", "refs": [{"name": "iThome", "url": "https://www.ithome.com.tw/news/179523"}, {"name": "行政院", "url": "https://www.ey.gov.tw/"}]}]};
